pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

include ':app'

// The services are NOT part of this build. They're published as a library
// (com.example:calc-services, in app/build.gradle) by their own build in services/. See README.md.
// To work on the services and the plugin together, uncomment this: Gradle then builds the
// services from source in place of the published library.
// includeBuild('services')
